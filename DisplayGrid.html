<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Grid</title>
    <style>
        .grid-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 1000px; margin: 20px auto; padding: 10px;">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSl37lb0CHM-c8FmTgtd-YWYhEMuI6wnBNWZOyDIoRtbvbtpKURTIhN_OQ&s" alt="" class="grid-img">
        <img src="https://www.istockphoto.com/photos/beauty-in-nature" alt="" class="grid-img">
        <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-nature-mountain-scenery-with-flowers-free-photo.jpg?w=600&quality=80" alt="" class="grid-img">
        <div></div>
        <div></div>
        <div></div>
    </div>

</body>
</html>
